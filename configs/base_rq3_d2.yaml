# Expression model finetuning (rq3_v2)
# ======================================
# Usage: torchrun --nproc_per_node=2 --master_port $port main.py --config configs/finetune_rq3.yaml

# --- Paths ---
# data_dir points to the local data/ folder for CCF CSV files used by rq3
data_dir: /work/pi_f008n64_dartmouth_edu/Mimyr/data
zhuang_data_dir: /work/pi_f008n64_dartmouth_edu/Mimyr/data
diseased_data_dir: /work/pi_f008n64_dartmouth_edu/Mimyr/data/cleaned_versions
expression_metadata_dir: /work/pi_f008n64_dartmouth_edu/Mimyr/spencer_code/models/generative_transformer/metadata
meta_info: /work/pi_f008n64_dartmouth_edu/Mimyr/spencer_code/models/generative_transformer/metadata/4hierarchy_metainfo_mouse_geneunion2_DAG.pt

# --- Job settings ---
run_mode: train
data_mode: rq3_v2_d2
device: cuda
skip_combined_fit: true

# --- Model checkpoints ---
expression_output_dir: /compute/oven-0-13/skrieger/Zhuang-2-v2_d2-test-base
expression_from_finetuned: false

# --- Training hyperparameters ---
expression_batch_size: 128
expression_max_len: 500
expression_no_shuffle: false
expression_epochs: 1000
expression_lr: 0.001
expression_lambda_val: 0.1
expression_new_expression_size: 100
expression_save_frequency: 2
expression_xyz_noise: true

# --- Test evaluation ---
expression_eval_test: true
expression_verbose_eval: true
