# Base expression model training on Zhuang-1 + scRNA-seq reference
# Usage: torchrun --nproc_per_node=3 --master_port $port main.py --config configs/train_base_zhuang1.yaml

# --- Paths ---
data_dir: /work/pi_f008n64_dartmouth_edu/Mimyr/data
zhuang_data_dir: /work/pi_f008n64_dartmouth_edu/Mimyr/data
expression_metadata_dir: /work/pi_f008n64_dartmouth_edu/Mimyr/spencer_code/models/generative_transformer/metadata
meta_info: /work/pi_f008n64_dartmouth_edu/Mimyr/spencer_code/models/generative_transformer/metadata/4hierarchy_metainfo_mouse_geneunion2_DAG.pt

# --- Job settings ---
run_mode: train
data_mode: base_zhuang1
device: cuda
skip_combined_fit: true

# --- Model ---
expression_model_size: medium
expression_output_dir: /compute/oven-0-13/skrieger/TG-base-zhuang1-2
expression_rebalance_only: true
# expression_from_finetuned: true
# expression_model_checkpoint: /compute/oven-0-13/skrieger/TG-base-zhuang1-2/epoch31_model.pt


# --- scRNA-seq reference ---
expression_adata2: /work/magroup/skrieger/tissue_generator/MERFISH_aging/sc_ref_xyz_mousegenes_raw.h5ad

# --- Training hyperparameters ---
expression_batch_size: 128
expression_max_len: 500
expression_no_shuffle: true
expression_epochs: 1000
expression_lr: 0.001
expression_lambda_val: 0.1
expression_new_expression_size: 100
expression_save_frequency: 1
expression_xyz_noise: true
expression_epoch_samples: 1000000
expression_log_per_steps: 10

expression_verbose_eval: true
